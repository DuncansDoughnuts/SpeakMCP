name: Amazon Build Ship Shape Alexa+ Contract

on:
  push:
    branches:
      - amazon-buildfest-alexa-plus
  pull_request:
    paths:
      - 'hackathons/amazon-build-ship-shape/alexa-plus-simulator/**'
      - '.github/workflows/amazon-buildfest-alexa-plus.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: hackathons/amazon-build-ship-shape/alexa-plus-simulator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run browser-simulator contract suite
        run: node test_contract.js
      - name: Run MCP 2025-11-25 mission-planner suite
        run: node test_mcp_server.js
      - name: Run Continuity MCP session/idempotency suite
        run: python -m unittest -v test_conformance.py
        working-directory: hackathons/amazon-build-ship-shape/alexa-plus-simulator/continuity_mcp
